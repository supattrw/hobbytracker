<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobby Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <div class="page-content">
      <div class="home-layout">
        <div class="home-left">
          <h1>Welcome to Hobby Tracker</h1>
          <p>Track your hobbies, save funny ideas to try, and keep your personal "how to" notes all in one place.</p>
          <button type="button" id="upload-latest-btn" class="primary-btn">Upload latest project</button>
        </div>

        <div class="home-right" id="latest-work-card">
          <!-- filled in dynamically by home-page.js -->
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> My Hobby Tracker</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/project-modal.js"></script>
  <script src="js/home-page.js"></script>
</body>
</html>
